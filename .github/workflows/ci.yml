name: FinalFlow CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINALFLOW_DISABLE_OPENAI: "true"
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and CI dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check installed dependency compatibility
        run: python -m pip check

      - name: Lint Python code
        run: python -m ruff check paddydash scripts tests

      - name: Compile Python modules
        run: python -m compileall -q paddydash scripts tests

      - name: Validate deployable Streamlit bundle
        run: python scripts/validation/check_streamlit_deployment.py --require-tracked

      - name: Run repository tests
        run: python -m unittest discover -s tests -v
