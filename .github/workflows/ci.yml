name: FinalFlow CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FINALFLOW_DISABLE_OPENAI: "true"
  FINALFLOW_DISABLE_SEARCH: "true"
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and CI dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Lint Python code
        run: python -m ruff check paddydash scripts tests
      - name: Compile Python modules
        run: python -m compileall -q paddydash scripts tests

  mobility-data-contracts:
    name: Mobility data contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and CI dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Regenerate compact mobility and dashboard data in a temporary directory
        run: |
          export FINALFLOW_DATA_DIR="$RUNNER_TEMP/finalflow-data"
          python scripts/synthetic/generate_finalflow_synthetic_inputs.py --output-dir "$FINALFLOW_DATA_DIR/synthetic"
          python scripts/synthetic/derive_finalflow_mobility_outputs.py --input-dir "$FINALFLOW_DATA_DIR/synthetic" --output-dir "$FINALFLOW_DATA_DIR/exports"
          python scripts/data/build_finalflow_dashboard_context.py --synthetic-dir "$FINALFLOW_DATA_DIR/synthetic" --mobility-export-dir "$FINALFLOW_DATA_DIR/exports" --output-dir "$FINALFLOW_DATA_DIR/exports"
      - name: Validate deterministic mobility and dashboard contracts
        run: python -m unittest tests.test_finalflow_synthetic_inputs tests.test_derived_mobility_outputs tests.test_dashboard_context_exports -v

  streamlit-readiness:
    name: Streamlit readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and CI dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate deployable Streamlit bundle
        run: python scripts/validation/check_streamlit_deployment.py --require-tracked
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
